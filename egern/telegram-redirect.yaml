name: "Telegram 链接直达"
description: "点开 t.me 链接时按所选客户端直接唤起，不走网页中转。移植自可莉 Loon 插件 TelegramRedirect.lpx。换客户端只需在模块参数里改 app（tg / sg / turrit / ime / ng / lingo）。"
author: "可莉🅥（luestr）· Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Telegram.png"
compat_arguments:
  app: "tg"

url_rewrites:
  - match: '^https://t\.me/([A-Za-z][A-Za-z0-9_]{3,30}[A-Za-z0-9])/?$'
    location: "{{{app}}}://resolve?domain=$1"
    status_code: 307
  - match: '^https://t\.me/\+([A-Za-z0-9_-]+)/?$'
    location: "{{{app}}}://join?invite=$1"
    status_code: 307

mitm:
  hostnames:
    - "t.me"
