name: "小象超市去广告"
description: "移植自可莉 Loon 插件 iMaiCai_remove_ads.lpx（2026-10-02 版）。拦截美团买菜（小象超市）开屏、横幅与首页推荐接口。 需要安装并信任 Egern 根证书。"
author: "可莉🅥 · Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/iMaiCai.png"
open_url: "https://apps.apple.com/app/id1444411068"

url_rewrites:
  - match: "^https://mall\\.meituan\\.com/api/c/homepage/splash"
    location: "http://reject-dict/"
  - match: "^https://mall\\.meituan\\.com/api/c/homepage/bubble/operate/info"
    location: "http://reject-dict/"
  - match: "^https://mall\\.meituan\\.com/api/c/jigsaw/code/category-banner-\\d+/"
    location: "http://reject-dict/"
  - match: "^https://mall\\.meituan\\.com/api/c/poi/\\d+/order/recommend/v\\d"
    location: "http://reject-dict/"
  - match: "^https://mall\\.meituan\\.com/api/c/banner/"
    location: "http://reject-dict/"
  - match: "^https://mall\\.meituan\\.com/api/c/poi/\\d+/personal/recommend"
    location: "http://reject-dict/"
  - match: "^https://businessapi\\.ksedt\\.com/signupindex/jxlist"
    location: "http://reject-dict/"

scriptings:
  - http_response:
      name: "美团买菜下发广告清理"
      match: '^https://portal-portm\.meituan\.com/horn_ios/mergeRequest'
      script_url: "https://raw.githubusercontent.com/yiyu12138/ziyong/main/egern/scripts/maicai/iMaiCai_remove_ads.js"
      body_required: true
      timeout: 10

mitm:
  hostnames:
    - "portal-portm.meituan.com"
    - "mall.meituan.com"
    - "businessapi.ksedt.com"
