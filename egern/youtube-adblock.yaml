name: "YouTube 去广告（规则版）"
description: "拦截 YouTube 广告接口。仅做网络层拦截，不含界面定制。移植自 RuCu6 youtube_gholts.lpx 的 Rewrite 部分（2026-10-22 版）。"
author: "Maasea / gholts / RuCu6 · Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://rucu6.pages.dev/Icons/app/youtube.png"
open_url: "https://apps.apple.com/app/id544007664"

mitm:
  hostnames:
    - "www.youtube.com"
    - "s.youtube.com"
    - "youtubei.googleapis.com"

rules:
  # 广告播放指令：拦掉后 App 拿不到插播广告数据
  - url_regex:
      match: "^https://youtubei\\.googleapis\\.com/youtubei/v1/player/ad_break"
      policy: REJECT
  # 广告播放统计
  - url_regex:
      match: "^https://s\\.youtube\\.com/api/stats/ads"
      policy: REJECT
  # 网页版广告位与素材
  - url_regex:
      match: "^https://www\\.youtube\\.com/(pagead|pcs)/"
      policy: REJECT
