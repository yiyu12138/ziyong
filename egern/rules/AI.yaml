name: "AI 规则"
description: "由 loon/AI.lsr 转换，可在模块设置里选择策略组"
author: "yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "arrow.triangle.branch"

compat_arguments:
  POLICY: "Proxy"

compat_arguments_desc: |
  POLICY：匹配到这些域名/IP 后走哪个策略。填代理服务器或策略组的名称，默认 Proxy。

rules:
  # Gemini
  - domain:
      match: "ai.google.dev"
      policy: {{{POLICY}}}
  - domain:
      match: "aida.googleapis.com"
      policy: {{{POLICY}}}
  - domain:
      match: "aistudio.google.com"
      policy: {{{POLICY}}}
  - domain:
      match: "alkalicore-pa.clients6.google.com"
      policy: {{{POLICY}}}
  - domain:
      match: "alkalimakersuite-pa.clients6.google.com"
      policy: {{{POLICY}}}
  - domain:
      match: "bard.google.com"
      policy: {{{POLICY}}}
  - domain:
      match: "deepmind.com"
      policy: {{{POLICY}}}
  - domain:
      match: "deepmind.google"
      policy: {{{POLICY}}}
  - domain:
      match: "geller-pa.googleapis.com"
      policy: {{{POLICY}}}
  - domain:
      match: "gemini.google"
      policy: {{{POLICY}}}
  - domain:
      match: "gemini.google.com"
      policy: {{{POLICY}}}
  - domain:
      match: "generativeai.google"
      policy: {{{POLICY}}}
  - domain:
      match: "generativelanguage.googleapis.com"
      policy: {{{POLICY}}}
  - domain:
      match: "makersuite.google.com"
      policy: {{{POLICY}}}
  - domain:
      match: "proactivebackend-pa.googleapis.com"
      policy: {{{POLICY}}}
  - domain:
      match: "robinfrontend-pa.googleapis.com"
      policy: {{{POLICY}}}
  - domain:
      match: "webchannel-alkalimakersuite-pa.clients6.google.com"
      policy: {{{POLICY}}}
  # GPT
  - and:
      match:
        - domain_keyword:
            match: "chatgpt-async-webps-prod-"
        - domain_suffix:
            match: "webpubsub.azure.com"
      policy: {{{POLICY}}}
  - and:
      match:
        - domain_keyword:
            match: "openaicom-api-"
        - domain_suffix:
            match: "azurefd.net"
      policy: {{{POLICY}}}
  - domain:
      match: "chatgpt.livekit.cloud"
      policy: {{{POLICY}}}
  - domain:
      match: "host.livekit.cloud"
      policy: {{{POLICY}}}
  - domain:
