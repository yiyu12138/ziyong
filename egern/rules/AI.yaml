      policy: {{{POLICY}}}
  - domain:
      match: "production-openaicom-storage.azureedge.net"
      policy: {{{POLICY}}}
  - domain:
      match: "turn.livekit.cloud"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "chat.com"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "chatgpt.com"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "chatgpt.site"
      policy: {{{POLICY}}}
  - domain_suffix:
