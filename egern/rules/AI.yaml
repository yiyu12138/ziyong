  - domain_suffix:
      match: "sora.com"
      policy: {{{POLICY}}}
  # Claude
  - domain_suffix:
      match: "anthropic.com"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "claude.ai"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "claude.com"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "claude.app"
      policy: {{{POLICY}}}
  - domain_suffix:
