name: "AI 规则"
description: "AI 服务分流：Gemini / ChatGPT / Claude / Grok / Perplexity / Cursor / Windsurf 等，共 55 条（基于 Repcz 规则集重做，已剔除 api.github.com）。"
author: "Repcz / yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "sparkles"

compat_arguments:
  POLICY: "Proxy"

compat_arguments_desc: |
  POLICY：匹配到这些域名后走哪个策略。填代理服务器或策略组的名称，默认 Proxy。

rules:
  # 精确域名
  - domain:
      match: 'ai.google.dev'
      policy: {{{POLICY}}}
  - domain:
      match: 'aida.googleapis.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'aisandbox-pa.googleapis.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'alkalicore-pa.clients6.google.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'antigravity-unleash.goog'
      policy: {{{POLICY}}}
  - domain:
      match: 'antigravity.google'
      policy: {{{POLICY}}}
  - domain:
      match: 'api.jetbrains.ai'
      policy: {{{POLICY}}}
  - domain:
      match: 'daily-cloudcode-pa.googleapis.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'file.oaiusercontent.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'gateway.ai.cloudflare.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'inference.codeium.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'jules.google.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'openrouter.ai'
      policy: {{{POLICY}}}
  - domain:
      match: 'robinfrontend-pa.googleapis.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'server.codeium.com'
      policy: {{{POLICY}}}
  - domain:
      match: 'server.self-serve.windsurf.com'
      policy: {{{POLICY}}}
  # 关键词
  - domain_keyword:
      match: 'alkalimakersuite-pa.clients6.google.com'
      policy: {{{POLICY}}}
  - domain_keyword:
      match: 'openai'
      policy: {{{POLICY}}}
  # 域名后缀
