      policy: {{{POLICY}}}
  - domain_suffix:
      match: "statsigapi.net"
      policy: {{{POLICY}}}
  - ip_cidr:
      match: "160.79.104.0/23"
      policy: {{{POLICY}}}
      no_resolve: true
  - ip_cidr6:
      match: "2607:6bc0::/48"
      policy: {{{POLICY}}}
      no_resolve: true
  - asn:
      match: "AS399358"
      policy: {{{POLICY}}}
      no_resolve: true
  # Muse
  - domain_suffix:
      match: "muse.ai"
      policy: {{{POLICY}}}
  # Manus
  - domain_suffix:
      match: "manus.im"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "manuscdn.com"
      policy: {{{POLICY}}}
  # x.ai / Grok
  - domain_suffix:
      match: "x.ai"
      policy: {{{POLICY}}}
  - domain_suffix:
      match: "grok.com"
      policy: {{{POLICY}}}
  - domain_keyword:
      match: "grokbot"
      policy: {{{POLICY}}}
  # Cursor
  - domain_suffix:
