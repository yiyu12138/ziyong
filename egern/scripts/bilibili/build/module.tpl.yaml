name: 哔哩哔哩去广告（Egern 原生版）
description: |-
  由可莉（kelee.one）的 Loon 插件 Bilibili_remove_ads.lpx 转写的 Egern 原生模块，参数与功能一一对应。
  · 规则：拦截 splash / 推荐流 / 番剧页 / 直播间 / grpc 接口广告，并屏蔽 bisapi 上报域名
  · 改写：11 条 jq 改写 + 5 条 mock 响应（2 个外链 jq 已内联，不再依赖上游 jq_file）
  · 脚本：3 个 kokoryh 脚本已做 Egern ctx 适配（gRPC 二进制 body 原样处理）+ 1 个 gRPC 精简脚本
  · 需要开启 HTTPS 解密（MitM），并支持 HTTP/2 / gRPC
  参数说明见模块设置页；空降助手默认关闭。
author: kokoryh, 可莉, 转写 Minis
homepage: https://kelee.one/Tool/Loon/Lpx/Bilibili_remove_ads.lpx
open_url: https://apps.apple.com/app/id736536022
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Bilibili.png

compat_arguments:
  SPONSOR_POLICY: DIRECT

compat_arguments_desc: |-
  SPONSOR_POLICY：bsbsb.top（空降助手数据源）这个域名走的策略。
  Loon 原版写的是 PROXY，Egern 不保证你有同名策略组，所以默认 DIRECT；
  如果开了空降助手却拉不到数据，把它改成你自己的代理策略组名。

env_schema:
  displayUpList:
    name: 动态页最常访问
    description: auto = 列表里出现直播状态时才显示；show = 总是显示；hide = 总是隐藏
    default_value: show
    options:
      - show
      - hide
      - auto
  purifyComment:
    name: 移除评论区置顶广告
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  optimizeRequest:
    name: 优化评论区加载异常
    description: 尝试修复评论区加载异常（涉及 View / 评论主列表请求）
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  sponsorBlock:
    name: 空降助手
    description: 跳过视频中插播广告；数据来自第三方 bsbsb.top，可能不准或失效
    default_value: 'false'
    options:
      - 'true'
      - 'false'
  logLevel:
    name: 日志等级
    default_value: 'off'
    options:
      - 'off'
      - error
      - warn
      - info
      - debug

rules:
  - domain:
      match: bsbsb.top
      policy: '{{{SPONSOR_POLICY}}}'
  - domain:
      match: api.biliapi.com
      policy: REJECT
  - domain:
      match: app.biliapi.com
      policy: REJECT
  - domain:
      match: api.biliapi.net
      policy: REJECT
  - domain:
      match: app.biliapi.net
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: chat.bilibili.com
        - or:
            match:
              - domain_keyword:
                  match: stun
              - domain_keyword:
                  match: tracker
              - domain_keyword:
                  match: p2p
      policy: REJECT

body_rewrites:
  - response_jq:
      match: '^https://api\.bilibili\.com/x/pd-proxy/tracker\?'
      filter: '.data[][]?="stun.chat.bilibili.com:3478"'
  - response_jq:
      match: '^https://app\.bilibili\.com/x/v2/splash/(show|event/list2)\?'
      filter: '.data |= with_entries(if .key | IN("show", "event_list") then .value = [] else . end)'
  - response_jq:
      match: '^https://app\.bilibili\.com/x/resource/show/tab/v2\?'
      filter: |
__TAB_JQ__
  - response_jq:
      match: '^https://app\.bilibili\.com/x/v2/feed/index\?'
      filter: 'if .data.items then .data.items |= map(select((.banner_item == null) and (.ad_info == null) and (.card_goto == "av") and (.card_type | IN("small_cover_v2", "large_cover_single_v9", "large_cover_v1")))) end'
  - response_jq:
      match: '^https://api\.bilibili\.com/pgc/view/v2/app/season\?'
      filter: 'del(.data.payment)'
  - response_jq:
      match: '^https://api\.bilibili\.com/pgc/page/channel\?'
      filter: '.data.modules |= map(select(.type != "TIP") | if .type == "BANNER" then .module_data.items |= map(select(.url | startswith("https://www.bilibili.com/blackboard/era/") | not)) else . end)'
  - response_jq:
      match: '^https://app\.bilibili\.com/x/v2/feed/index/story\?'
      filter: 'if .data.items then .data.items |= map(select((.ad_info == null) and (.card_goto | IN("vertical_ad_av", "vertical_ad_live", "vertical_ad_picture") | not)) | del(.story_cart_icon, .free_flow_toast, .image_infos, .course_info, .game_info)) end'
  - response_jq:
      match: '^https://api\.live\.bilibili\.com/xlive/open-interface/v2/tracker/conf\?'
      filter: '.data.domains=["wss://tracker.chat.bilibili.com"]'
  - response_jq:
      match: '^https://app\.bilibili\.com/x/resource/show/skin\?'
      filter: 'delpaths([["data", "common_equip"]])'
  - response_jq:
      match: '^https://app\.bilibili\.com/x/v2/account/mine(/ipad)?\?'
      filter: |
__MINE_JQ__
  - response_jq:
      match: '^https://app\.bilibili\.com/x/v2/account/myinfo\?'
      filter: '.data.vip |= if . != null and .status == 0 then . + { status: 1, type: 2, due_date: 9005270400000, role: 15 } else . end'

map_locals:
  - match: '^https://app\.bilibili\.com/x/v2/splash/list\?'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'
  - match: '^https://api\.bilibili\.com/pgc/activity/deliver/material/receive\?'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
  - match: '^https://ap[ip]\.bilibili\.com/x/(resource/(top/activity|patch/tab(/v2)?)|v2/search/square|vip/ads/materials)\?'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
  - match: '^https://line3-h5-mobile-api\.biligame\.com/game/live/large_card_material\?'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'
  - match: '^https://api\.live\.bilibili\.com/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info\?'
    status_code: 200
    headers:
      Content-Type: application/json
    body: '{}'

header_rewrites:
  - add:
      match: '^https://grpc\.biliapi\.net/bilibili\.app\.(?:interface\.v1\.(?:Teenagers/ModeStatus|Search/DefaultWords)|view\.v1\.View/TFInfo|viewunite\.v1\.View/(?:PlayPause|ViewEndPage))$'
      name: grpc-status
      value: '0'
      type: response

scriptings:
  - http_request:
      name: 空降助手 / 评论区请求处理
      match: '^https://(?:grpc\.biliapi\.net|app\.bilibili\.com)/bilibili\.(?:community\.service\.dm\.v1\.DM/DmSegMobile|app\.viewunite\.v1\.View/View|main\.community\.reply\.v1\.Reply/MainList)$'
      script_url: 'https://raw.githubusercontent.com/yiyu12138/ziyong/main/egern/scripts/bilibili/bilibili-proto-request.js'
      body_required: true
      binary_body: true
      timeout: 20
      max_size: 8388608
      env:
        sponsorBlock: 'false'
        optimizeRequest: 'true'
        purifyComment: 'true'
        logLevel: 'off'
  - http_response:
      name: ProtoBuf 处理
      match: '^https://(grpc\.biliapi\.net|app\.bilibili\.com)/bilibili\.(app\.(show\.v1\.Popular/Index|dynamic\.v2\.Dynamic/DynAll|view(unite)?\.v1\.View/(View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL/PlayView|playerunite\.v1\.Player/PlayViewUnite)|polymer\.app\.search\.v1\.Search/SearchAll|community\.service\.dm\.v1\.DM/DmView|main\.community\.reply\.v1\.Reply/MainList|pgc\.gateway\.player\.v2\.PlayURL/PlayView)$'
      script_url: 'https://raw.githubusercontent.com/yiyu12138/ziyong/main/egern/scripts/bilibili/bilibili-proto-response.js'
      body_required: true
      binary_body: true
      timeout: 20
      max_size: 8388608
      env:
        displayUpList: 'show'
        purifyComment: 'true'
        sponsorBlock: 'false'
        logLevel: 'off'
  - http_response:
      name: 移除直播间广告
      match: '^https://api\.live\.bilibili\.com/xlive/(?:app-interface/v2/index/feed|app-room/v1/index/getInfoBy(?:Room|User))\?'
      script_url: 'https://raw.githubusercontent.com/yiyu12138/ziyong/main/egern/scripts/bilibili/bilibili-json.js'
      body_required: true
      timeout: 20
      max_size: 8388608
  - http_response:
      name: gRPC 响应精简（青少年弹窗 / 默认搜索词 / 播放结束页）
      match: '^https://grpc\.biliapi\.net/bilibili\.app\.(?:interface\.v1\.Teenagers/ModeStatus|interface\.v1\.Search/DefaultWords|view\.v1\.View/TFInfo|viewunite\.v1\.View/(?:PlayPause|ViewEndPage))$'
      script_url: 'https://raw.githubusercontent.com/yiyu12138/ziyong/main/egern/scripts/bilibili/bilibili-grpc-mock.js'
      body_required: true
      timeout: 10

mitm:
  hostnames:
    includes:
      - grpc.biliapi.net
      - app.bilibili.com
      - api.bilibili.com
      - api.live.bilibili.com
      - line3-h5-mobile-api.biligame.com
