name: "拼多多去广告"
description: "移植自可莉 Loon 插件 PinDuoDuo_remove_ads.lpx（2026-10-02 版）。拦截拼多多广告/统计域名与首页推荐接口，清理首页、订单页、个人中心广告位。 需要安装并信任 Egern 根证书。"
author: "ZenmoFeiShi, 可莉🅥 · Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/PinDuoDuo.png"
open_url: "https://apps.apple.com/app/id1044283059"

rules:
  - and:
      match:
        - url_regex:
            match: "^http:\\/\\/((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\/d(\\d)?"
        - user_agent:
            match: "*com.xunmeng.pinduoduo*"
      policy: REJECT
  - and:
      match:
        - url_regex:
            match: "^http:\\/\\/\\[[0-9a-fA-F:]+\\]\\/d(\\d)?\\?"
        - user_agent:
            match: "*com.xunmeng.pinduoduo*"
      policy: REJECT
  - and:
      match:
        - domain:
            match: "api.pinduoduo.com"
        - protocol:
            match: "QUIC"
      policy: REJECT
  - domain:
      match: "titan.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "xg.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "cdl-1.pddpic.com"
      policy: REJECT
  - domain:
      match: "cdl-p2.pddpic.com"
      policy: REJECT
  - domain:
      match: "cd-1.pddpic.com"
      policy: REJECT
  - domain:
      match: "apm.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "th-b.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "ta.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "th.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "th-a.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "ta-a.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "meta.pinduoduo.com"
      policy: REJECT
  - domain:
      match: "apm-a.pinduoduo.com"
      policy: REJECT

url_rewrites:
  - match: "^https://api\\.pinduoduo\\.com/api/aristotle/unrated_order_for_unreceived_tab\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/aristotle/query_order_list_tabs_element\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/aquarius/hungary/global/homepage\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/caterham/v3/query/order_express_group\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/search_hotquery\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/zaire_biz/chat/resource/get_list_data\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/caterham/v3/query/new_chat_group\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/alexa/goods/back_up\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/caterham/v3/query/personal\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/brand-olay/goods_detail/bybt_guide\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/engels/reviews/require/append\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/caterham/v3/query/my_order_group\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/caterham/v3/query/likes\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/phantom/gbdbpdv/extra\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/manufacturer/cross/shortcut/list\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/dunkirk/liveactivity/push/create/url/report\\?"
