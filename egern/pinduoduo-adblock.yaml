  - match: "^https://api\\.pinduoduo\\.com/api/engels/wait/receive/review\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/buffon/nasus/recommend\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.pinduoduo\\.com/api/caterham/v2/query/goods_detail_with_tags\\?"
    location: "http://reject-dict/"

body_rewrites:
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/api/alexa/homepage/hub\\?"
      filter: '(del(.result.dy_module.irregular_banner_dy, .result.icon_set, .result.search_bar_hot_query, .result.dy_module.irregular_banner_dy)) | (.result.bottom_tabs? |= map(select(.link | IN("index.html", "chat_list.html", "personal.html"))) | .result.buffer_bottom_tabs? |= map(select(.link | IN("index.html", "chat_list.html", "personal.html"))) | .result.all_top_opts |= map(del(.selected_image, .image, .height, .width)))'
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/search\\?"
      filter: 'del(.expansion)'
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/api/philo/personal/hub\\?"
      filter: 'del(.monthly_card_entrance, .personal_center_style_v2_vo, .icon_set.icons, .icon_set.top_personal_icons, .personal_banner)'
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/api/oak/integration/render\\?"
      filter: 'del(.bottom_section_list, .ui.bottom_section, .ui.live_section.float_info)'
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/api/caterham/v3/query/order_detail_group\\?"
      filter: 'del(.data.goods_list)'
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/order/"
      filter: 'del(.marketing_banner_vo, .shipping.banner_above_recommend)'
  - response_jq:
      match: "^https://api\\.pinduoduo\\.com/api/aristotle/order_list_v4\\?"
      filter: '.orders |= map(.order_buttons |= map(del(.order_growth_tip)))'

scriptings:
  - http_response:
      name: "拼多多扫码页推荐清理"
      match: '^https://m\.pinduoduo\.net/mdkd/package\?from_app_scan'
      script_url: "https://raw.githubusercontent.com/yiyu12138/ziyong/main/egern/scripts/pinduoduo/PinDuoDuo_remove_ads.js"
      body_required: true
      timeout: 10

mitm:
  hostnames:
    - "api.pinduoduo.com"
    - "m.pinduoduo.net"
