name: "番茄小说去广告"
description: "拦截番茄小说开屏、章末、听书页广告及埋点上报。移植自 kelee Loon 插件 DragonRead_remove_ads.lpx（2025-05-13 版），规则经去重整理。"
author: "可莉🅥（luestr）· Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DragonRead.png"
open_url: "https://apps.apple.com/app/id1468454200"

rules:
  - and:
      match:
        - domain_keyword:
            match: "-ad-"
        - domain_suffix:
            match: "byteimg.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "-ttam-"
        - domain_suffix:
            match: "ibyteimg.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "ssdk-"
        - domain_suffix:
            match: "pangle.io"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "pangolin"
        - domain_suffix:
            match: "sgsnssdk.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "lf"
        - domain_keyword:
            match: "-short.bytetos.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "v"
        - domain_keyword:
            match: "-be-pack.pglstatp-toutiao.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "sf"
        - domain_keyword:
            match: "-be-pack.pglstatp-toutiao.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "s"
        - domain_keyword:
            match: "-fe-scm.pglstatp-toutiao.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "sf"
        - domain_keyword:
            match: "-ttcdn-tos.pstatp.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "sf"
        - domain_keyword:
            match: "-fe-tos.pglstatp-toutiao.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "sf"
        - domain_keyword:
            match: "-static.i18n-pglstatp.com"
      policy: REJECT
  - and:
      match:
        # 原版标记「误杀」：bytescm.com 是字节前端 CDN，如果发现正文/功能异常，
        # 给下面 policy: REJECT 同级加一行 disabled: true 即可关掉这一条
        - domain_keyword:
            match: "if"
        - domain_keyword:
            match: "-cdn-tos.bytescm.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "if"
        - domain_keyword:
            match: "-analytics.bytescm.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "lf"
        - domain_keyword:
            match: "-analytics.bytescm.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "ads"
        - domain_keyword:
            match: "normal"
        - domain_suffix:
            match: "zijieapi.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "api"
        - domain_keyword:
            match: "-access-"
        - domain_suffix:
            match: "pangle.io"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "api"
        - domain_keyword:
            match: "-log-"
        - domain_suffix:
            match: "pangle.io"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "api"
        - domain_keyword:
            match: "-dual-event-"
        - domain_suffix:
            match: "pangle.io"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "api"
        - domain_keyword:
            match: "pangolin"
        - domain_suffix:
            match: "sgsnssdk.com"
      policy: REJECT
  - and:
      match:
        - domain_keyword:
            match: "ads"
        - domain_keyword:
            match: "-normal-lq"
        - domain_suffix:
            match: "zijieapi.com"
      policy: REJECT
  - url_regex:
      match: "^http:\\/\\/p\\d+-be-pack-sign\\.pglstatp-toutiao\\.com\\/(ad-app-package|web\\.business\\.image)\\/"
      policy: REJECT
  - domain:
      match: "mon.zijieapi.com"
      policy: REJECT
  - domain:
      match: "lf-ad-ies.bytecdn.cn"
      policy: REJECT
  - domain:
