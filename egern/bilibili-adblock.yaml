name: "哔哩哔哩去广告"
description: "清理 B 站开屏、首页推荐、动态、直播间、搜索页与付费预览位广告（jq/正则改写层）。原插件的 Protobuf 二进制脚本（空降助手、评论净化、底栏定制）未移植，这三项功能不生效。需要安装并信任 Egern 根证书。"
author: "kokoryh · Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Bilibili.png"
open_url: "https://apps.apple.com/app/id736536022"

rules:
  - domain:
      match: "bsbsb.top"
      policy: PROXY
  - domain:
      match: "api.biliapi.com"
      policy: REJECT
  - domain:
      match: "app.biliapi.com"
      policy: REJECT
  - domain:
      match: "api.biliapi.net"
      policy: REJECT
  - domain:
      match: "app.biliapi.net"
      policy: REJECT
  - and:
      match:
        - domain_suffix:
            match: "chat.bilibili.com"
      policy: REJECT

url_rewrites:
  - match: "^https://line3-h5-mobile-api\\.biligame\\.com/game/live/large_card_material\\?"
    location: "http://reject-dict/"
  - match: "^https://api\\.live\\.bilibili\\.com/xlive/e-commerce-interface/v1/ecommerce-user/get_shopping_info\\?"
    location: "http://reject-dict/"

body_rewrites:
  - response_jq:
      match: "^https://api\\.bilibili\\.com/x/pd-proxy/tracker\\?"
      filter: '.data[][]?="stun.chat.bilibili.com:3478"'
  - response_jq:
      match: "^https://app\\.bilibili\\.com/x/v2/splash/(show|event/list2)\\?"
      filter: '.data |= with_entries(if .key | IN("show", "event_list") then .value = [] else . end)'
  - response_regex:
      match: "^https://app\\.bilibili\\.com/x/v2/splash/list\\?"
      find: '^[\s\S]*$'
      replace: "{\"code\":0,\"message\":\"OK\",\"ttl\":1,\"data\":{\"max_time\":0,\"min_interval\":31536000,\"pull_interval\":31536000,\"keep_ids\":[],\"show\":[],\"list\":[{}],\"splash_request_id\":\"\"}}"
  - response_jq:
      match: "^https://app\\.bilibili\\.com/x/resource/show/tab/v2\\?"
      filter: ".data.tab = [\n    {\n        pos: 1,\n        id: 477,\n        name: \"推荐\",\n        tab_id: \"推荐tab\",\n        uri: \"bilibili://pegasus/promo\",\n        default_selected: 1\n    },\n    {\n        pos: 2,\n        id: 478,\n        name: \"热门\",\n        tab_id: \"热门tab\",\n        uri: \"bilibili://pegasus/hottopic\"\n    },\n    {\n        pos: 3,\n        id: 545,\n        name: \"动画\",\n        tab_id: \"bangumi\",\n        uri: \"bilibili://pgc/home\"\n    },\n    {\n        pos: 4,\n        id: 151,\n        name: \"影视\",\n        tab_id: \"film\",\n        uri: \"bilibili://pgc/cinema-tab\"\n    },\n    {\n        pos: 5,\n        id: 731,\n        name: \"直播\",\n        tab_id: \"直播tab\",\n        uri: \"bilibili://live/home\"\n    }\n] | \n.data.top = [\n    {\n        pos: 1,\n        id: 176,\n        name: \"消息\",\n        tab_id: \"消息Top\",\n        uri: \"bilibili://link/im_home\",\n        icon: \"http://i0.hdslb.com/bfs/archive/d43047538e72c9ed8fd8e4e34415fbe3a4f632cb.png\"\n    }\n] | \n.data.bottom = [\n    {\n        pos: 1,\n        id: 177,\n        name: \"首页\",\n        tab_id: \"home\",\n        uri: \"bilibili://main/home/\",\n        icon: \"http://i0.hdslb.com/bfs/archive/63d7ee88d471786c1af45af86e8cb7f607edf91b.png\",\n        icon_selected: \"http://i0.hdslb.com/bfs/archive/e5106aa688dc729e7f0eafcbb80317feb54a43bd.png\"\n    },\n    {\n        pos: 2,\n        id: 179,\n        name: \"动态\",\n        tab_id: \"dynamic\",\n        uri: \"bilibili://following/home/\",\n        icon: \"http://i0.hdslb.com/bfs/archive/86dfbe5fa32f11a8588b9ae0fccb77d3c27cedf6.png\",\n        icon_selected: \"http://i0.hdslb.com/bfs/archive/25b658e1f6b6da57eecba328556101dbdcb4b53f.png\"\n    },\n    {\n        pos: 5,\n        id: 181,\n        name: \"我的\",\n        tab_id: \"我的Bottom\",\n        uri: \"bilibili://user_center/\",\n        icon: \"http://i0.hdslb.com/bfs/archive/4b0b2c49ffeb4f0c2e6a4cceebeef0aab1c53fe1.png\",\n        ico