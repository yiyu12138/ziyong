name: "菜鸟去广告"
description: "移植自可莉 Loon 插件 Cainiao_remove_ads.lpx（2026-10-02 版）。拦截菜鸟开屏与信息流广告接口，清理首页/包裹页广告位。 需要安装并信任 Egern 根证书。"
author: "小白脸 · Egern 移植 yiyu12138"
homepage: "https://github.com/yiyu12138/ziyong"
icon: "https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Cainiao.png"
open_url: "https://apps.apple.com/app/id951610982"

url_rewrites:
  - match: "^https://nbcps-mtop\\.cainiao\\.com/gw/mtop\\.cainiao\\.nbcps\\.presentation\\.fetch\\.cn"
    location: "http://reject/"
  - match: "^https://netflow-mtop\\.cainiao\\.com/gw/mtop\\.cainiao\\.guoguo\\.nbnetflow\\.ads\\.index"
    location: "http://reject/"
  - match: "^https://cn-acs\\.m\\.cainiao\\.com/gw/mtop\\.cainiao\\.adkeyword\\.get\\.cn"
    location: "http://reject/"
  - match: "^https://cn-acs\\.m\\.cainiao\\.com/gw/mtop\\.cainiao\\.guoguo\\.nbnetflow\\.ads\\.m?show"
    location: "http://reject/"

body_rewrites:
  - response_jq:
      match: "^https://(cn-acs\\.m|e2e-mtop)\\.cainiao\\.com/gw/mtop\\.cainiao\\.app\\.e2e\\.engine\\.page\\.fetch"
      filter: 'del(.data.data.data.mainSearch.bizData.searchContents, .data.data.data.operationList)'
  - response_jq:
      match: "^https://e2e-mtop\\.cainiao\\.com/gw/mtop\\.cainiao\\.app\\.e2e\\.engine\\.page\\.fetch\\.cn"
      filter: 'del(.data.data.banner, .data.data.activity, .data.data.vip)'
  - response_jq:
      match: "^https://longquan-mtop\\.cainiao\\.com/gw/mtop\\.com\\.cainiao\\.longquan\\.place\\.getpageresourcecontent\\.cn"
      filter: 'del(.data.result.placeContentMap["780001"].contentList)'
  - response_jq:
      match: "^https://netflow-mtop\\.cainiao\\.com/gw/mtop\\.cainiao\\.guoguo\\.nbnetflow\\.ads"
      filter: 'if .data.result[0].materialId == "39017" then . else .data = {} end'

mitm:
  hostnames:
    - "netflow-mtop.cainiao.com"
    - "nbcps-mtop.cainiao.com"
    - "cn-acs.m.cainiao.com"
    - "e2e-mtop.cainiao.com"
    - "longquan-mtop.cainiao.com"
