<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f8">
<title>自用</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="自用">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2312A150'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='-apple-system'%3E自%3C/text%3E%3C/svg%3E">
<style>
:root{--g:#12A150;--ink:#0d0d0f;--sub:#82828a;--line:#ebebef;--bg:#f6f6f8;--card:#fff;--gold:#E09B12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
a{color:inherit}
.app{display:flex;min-height:100vh}

/* 侧边栏 */
.side{position:fixed;top:0;left:0;bottom:0;width:236px;background:#fff;border-right:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 18px) 14px 16px;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.brand img{width:34px;height:34px;border-radius:10px}
.brand b{font-size:18px;letter-spacing:-.4px}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:0}
.nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;font-size:14px;color:#3f3f45;text-decoration:none}
.nav a:hover,.nav a.on{background:#f2f2f5;color:var(--ink);font-weight:600}
.nav .c{margin-left:auto;font-size:11px;color:var(--sub)}
.sfoot{border-top:1px solid var(--line);padding-top:12px;font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.sfoot a{text-decoration:none;color:#5d5d64;border-bottom:1px dashed #c9c9cf}

/* 主区 */
.main{flex:1;margin-left:236px;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(246,246,248,.94);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 22px 12px;display:flex;align-items:center;gap:12px}
.menu{display:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px}
#q{flex:1;max-width:420px;padding:9px 13px;border:1px solid var(--line);border-radius:11px;font-size:14.5px;background:#fff;outline:none}
#q:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(18,161,80,.10)}
.icons{display:flex;gap:8px;margin-left:auto}
.icon{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#3f3f45;text-decoration:none}
.icon.on{background:#FFF6E5;border-color:#F5C86B;color:var(--gold)}

.content{padding:18px 22px 80px}
.sec{margin-bottom:26px;scroll-margin-top:70px}
.sec h2{font-size:14px;font-weight:600;color:#6a6a71;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .n{font-size:11px;color:#a8a8ae;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.card .hd{display:flex;align-items:center;gap:9px}
.ic{width:32px;height:32px;border-radius:9px;flex:0 0 auto;object-fit:cover;background:#f2f2f5}
.ic.ph{display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;background:linear-gradient(135deg,#1FBF63,#0B7A3C)}
.card h3{margin:0;font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.star{border:0;background:none;color:#d5d5da;font-size:15px;padding:0 2px}
.star.on{color:var(--gold)}
.desc{margin:8px 0 10px;font-size:12.5px;line-height:1.55;color:#69696f;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{display:block;-webkit-line-clamp:unset}
.ft{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px;border-top:1px solid #f4f4f6}
.fold{border:0;background:none;color:var(--g);font-size:12px;font-weight:600;padding:0;margin-right:auto}
.go{margin-left:auto;padding:5px 14px;border-radius:8px;background:var(--g);color:#fff;font-size:13px;font-weight:600;text-decoration:none;border:0}
.card.done{background:#fafafb}
.card.done .go{background:#ededf0;color:#a3a3a9}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;color:#5f5f66}
.empty{color:var(--sub);text-align:center;padding:60px 0;font-size:13.5px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;display:none}
.mask.on{display:block}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(20,20,22,.9);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none;max-width:80vw;text-align:center}
.toast.on{opacity:1}

@media(max-width:820px){
  .side{display:none;width:78%;max-width:300px;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .side.on{display:flex}
  .main{margin-left:0}
  .menu{display:flex;align-items:center;justify-content:center}
  .topbar{padding-left:14px;padding-right:14px;gap:9px}
  .content{padding:14px 14px 70px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <img alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231FBF63'/%3E%3Cstop offset='1' stop-color='%230B7A3C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-family='-apple-system,BlinkMacSystemFont,PingFang SC'%3E自%3C/text%3E%3C/svg%3E">
      <div><b>自用</b><small id="brandSub">加载中…</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot"><span>手动维护</span><a href="admin">管理</a></div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu" id="menuBtn">☰</button>
      <input id="q" placeholder="搜索名称、功能、拼音" autocomplete="off">
      <div class="icons">
        <a class="icon" id="adminLink" href="admin" title="管理">⚙</a>
      </div>
    </div>
    <div class="content" id="list"></div>
  </div>
</div>
<div class="mask" id="mask"></div>
<div class="toast" id="toast"></div>
<div id="errbar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:999;background:#d93a30;color:#fff;padding:8px 12px;font-size:12px;white-space:pre-wrap"></div>
<script src="app.js?v=blog1"></script>
</body>
</html>
