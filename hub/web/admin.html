<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f6f8">
<title>管理 · 自用</title>
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--g:#12A150;--ink:#0d0d0f;--sub:#82828a;--line:#ebebef;--bg:#f6f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:90px}
header{position:sticky;top:0;z-index:20;background:rgba(246,246,248,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:19px}
header .r{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-size:13.5px;color:#3f3f45}
.btn.primary{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.btn:disabled{opacity:.5}
main{padding:12px 16px;display:flex;flex-direction:column;gap:9px}
.item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;display:flex;align-items:center;gap:10px}
.item img,.item .ph{width:34px;height:34px;border-radius:9px;flex:0 0 auto;object-fit:cover;background:#f2f2f5}
.item .ph{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px;background:linear-gradient(135deg,#1FBF63,#0B7A3C)}
.item .info{flex:1;min-width:0}
.item .n{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{font-size:11.5px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tagp{display:inline-block;font-size:10px;padding:1px 6px;border-radius:5px;background:#f2f2f5;color:#7d7d84;margin-left:6px}
.tagp.dirty{background:#FFF3E0;color:#B26A00}
.tagp.del{background:#FFECEA;color:#D1403A}
.sheet{position:fixed;inset:0;background:#f6f6f8;z-index:60;display:none;flex-direction:column}
.sheet.on{display:flex}
.sheet .sh{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);background:#fff}
.sheet .sh h2{margin:0;font-size:17px}
.sheet .sh .x{margin-left:auto;border:0;background:none;font-size:15px;color:var(--sub)}
.sheet .bd{flex:1;overflow:auto;padding:14px 16px 30px}
.field{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
.field label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:5px}
.field input,.field textarea{width:100%;border:0;outline:none;background:transparent;font:inherit;color:var(--ink);padding:0}
.field textarea{min-height:44px;resize:vertical;line-height:1.5}
.field.codebox textarea{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:300px;white-space:pre}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:70;padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:none;gap:10px}
.bar.on{display:flex}
.bar .save{flex:1;padding:13px;border-radius:12px;background:var(--g);color:#fff;font-size:15.5px;font-weight:600;border:0}
.bar .del{padding:13px 18px;border-radius:12px;background:#fff;color:#d1403a;border:1px solid #ffd9d6;font-size:15px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(20,20,22,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:99;max-width:80vw;text-align:center;pointer-events:none}
.toast.on{opacity:1}
.hint{font-size:11.5px;color:#9b9ba1;line-height:1.6;margin:2px 4px 12px}
</style>
</head>
<body>
<header>
  <h1>管理</h1>
  <div class="r">
    <button class="btn" id="toSite">前台</button>
    <button class="btn" id="catBtn">分类</button>
    <button class="btn primary" id="publishBtn">发布</button>
    <button class="btn" id="newBtn">＋</button>
  </div>
</header>
<main id="list"></main>

<div class="sheet" id="sheet">
  <div class="sh"><h2 id="sheetTitle">编辑</h2><button class="x" id="closeBtn">取消</button></div>
  <div class="bd">
    <div class="field"><label>名称</label><input id="f-name"></div>
    <div class="field"><label>说明</label><textarea id="f-desc" rows="2"></textarea></div>
    <div class="field"><label>分类</label><input id="f-group" placeholder="Egern 插件 / 分流规则"></div>
    <div class="field"><label>文件名（不含 .yaml）</label><input id="f-slug" placeholder="bilibili-adblock"></div>
    <div class="field"><label>图标 URL（可空）</label><input id="f-icon"></div>
    <div class="field codebox"><label>正文（yaml / sgmodule 内容）</label><textarea id="f-body" spellcheck="false"></textarea></div>
    <p class="hint">正文留空也行，发布时会生成一个只有 name/description 的空模块。保存后要点右上角「发布」才会提交到 GitHub。</p>
  </div>
</div>
<div class="bar" id="bar">
  <button class="save" id="saveBtn">保存</button>
  <button class="del" id="delBtn">删除</button>
</div>
<div class="sheet" id="catSheet">
  <div class="sh"><h2>分类</h2><button class="x" id="catClose">完成</button></div>
  <div class="bd">
    <div id="catList"></div>
    <button class="btn primary" id="catAdd" style="width:100%;margin-top:10px;padding:12px">＋ 新增分类</button>
    <p class="hint" style="margin-top:14px">分类绑定的目录用于「扫描导入」：把仓库里该目录的文件批量收进来。新建条目时不填目录也可以，保存后手写正文。</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
